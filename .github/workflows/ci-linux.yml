name: Linux

on:
  push:
    branches:
      - master
      - develop
    tags:
      - '*'
  pull_request:
  # Enable manual run
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  setup-phpunit-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        uses: galette/.github/actions/matrix-generator@main
        with:
          all-jobs: ${{ github.event_name != 'pull_request' && github.repository == 'galette/plugin-paypal' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags')) }}

  setup-lint-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        uses: galette/.github/actions/matrix-generator@main
        with:
          target: lint
          all-jobs: ${{ github.event_name != 'pull_request' && github.repository == 'galette/plugin-paypal' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags')) }}

  lint:
    runs-on: ubuntu-latest
    needs: setup-lint-matrix
    name: "Lint on PHP ${{ matrix.php-version }}"

    strategy:
      matrix: ${{ fromJSON(needs.setup-lint-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: ${{ matrix.coverage }}

      - name: Checkout Galette core
        uses: actions/checkout@v7
        with:
          repository: galette/galette
          path: galette-core
          fetch-depth: 1
          ref: develop

      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: galette-core/galette/plugins/plugin-paypal

      - name: Get composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          cd galette-core
          composer install --ignore-platform-reqs

      - name: CS
        run: |
          cd galette-core/galette/plugins/plugin-paypal
          ../../vendor/bin/phpcs lib/ ./*.php

      - name: CS Fixer
        if: matrix.php-is-min
        run: |
          cd galette-core/galette/plugins/plugin-paypal
          ../../vendor/bin/php-cs-fixer check --show-progress=dots --verbose --diff

      - name: Twig CS
        run: |
          cd galette-core/galette/plugins/plugin-paypal
          ../../vendor/bin/twigcs templates/default --severity error --display blocking

      - name: PHPStan checks
        run: |
          cd galette-core/galette/plugins/plugin-paypal
          ../../vendor/bin/phpstan analyze --ansi --memory-limit=2G --no-interaction --no-progress

      - name: Headers checks
        run: |
          cd galette-core
          ./bin/console galette:headers:check \
            --project-name="Galette Paypal plugin" \
            --start-year="2011" \
            --directory="galette/plugins/plugin-paypal"

  unit-tests:
    runs-on: ubuntu-latest
    needs: setup-phpunit-matrix

    strategy:
      matrix: ${{ fromJSON(needs.setup-phpunit-matrix.outputs.matrix) }}
      fail-fast: false

    env:
      DB: ${{ matrix.db-image }}

    services:
      # Label used to access the service container
      db:
        # Docker Hub image
        image: ${{ matrix.db-image }}
        # Provide env variables for both mysql and pgsql
        env:
          POSTGRES_USER: galette_tests
          POSTGRES_PASSWORD: g@l3tte
          POSTGRES_DB: galette_tests
          MYSQL_USER: galette_tests
          MYSQL_PASSWORD: g@l3tte
          MYSQL_ROOT_PASSWORD: g@l3tte
          MYSQL_DATABASE: galette_tests
        # Open network ports for both mysql and pgsql
        ports:
          - 3306:3306
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd="bash -c 'if [[ -n $(command -v pg_isready) ]]; then pg_isready; else if [[ -n $(command -v mysqladmin) ]]; then mysqladmin ping; else mariadb-admin ping; fi fi'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    name: PHP ${{ matrix.php-version }} ${{ matrix.db-image }} ${{ (matrix.always == false && (github.event_name == 'pull_request' || github.repository != 'galette/plugin-paypal' || !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags')))) && ' (skipped)' || matrix.coverage == 'xdebug' && ' (with coverage)' || ''}}

    steps:
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer, pecl
          coverage: ${{ matrix.coverage }}
          extensions: apcu
          ini-values: apc.enable_cli=1

      - name: "Show versions"
        run: |
          php --version
          composer --version
          echo "node $(node --version)"
          echo "npm $(npm --version)"
          docker exec ${{ job.services.db.id }} bash -c "if [[ -n \$(command -v psql) ]]; then psql --version; else if [[ -n \$(command -v mysql) ]]; then mysql --version; else mariadb --version; fi fi"

      - name: Build Galette
        uses: galette/.github/actions/build-galette@main
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: galette-core/galette/plugins/plugin-paypal

      - name: Init for PostgreSQL
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd galette-core
          bin/console galette:install -v --dbtype=pgsql --dbhost=localhost --dbname=galette_tests --dbuser=galette_tests --dbpass=g@l3tte --admin=admin --password=admin --no-interaction -w
          bin/console galette:plugins:install-db --all
        if: startsWith(matrix.db-image, 'postgres')

      - name: Init for MariaDB
        run: |
          cd galette-core
          mysql -e 'create database IF NOT EXISTS galette_tests;' -u galette_tests --password=g@l3tte -h 127.0.0.1 -P 3306
          bin/console galette:install -v --dbtype=mysql --dbhost=127.0.0.1 --dbname=galette_tests --dbuser=galette_tests --dbpass=g@l3tte --admin=admin --password=admin --no-interaction -w
          bin/console galette:plugins:install-db --all
        if: startsWith(matrix.db-image, 'mysql') || startsWith(matrix.db-image, 'mariadb')

      - name: Unit tests
        run: |
          cd galette-core/galette/plugins/plugin-paypal
          ../../vendor/bin/phpunit --test-suffix=.php --bootstrap tests/TestsBootstrap.php --no-coverage --process-isolation tests/GalettePaypal/

  e2e-tests:
    runs-on: ubuntu-latest
    name: "E2E Playwright — chromium (postgres:17)"
    env:
      DB: pgsql
      GALETTE_TESTS: 1

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: galette_tests
          POSTGRES_PASSWORD: g@l3tte
          POSTGRES_DB: galette_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer, pecl
          coverage: none
          extensions: apcu, pdo_pgsql
          ini-values: apc.enable_cli=1

      - name: Build Galette
        uses: galette/.github/actions/build-galette@main
        with:
          php-version: "8.5"
          enable-assets-cache: true

      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: galette-core/galette/plugins/plugin-paypal

      - name: Initialize test data
        run: |
          cd galette-core
          php tests/init_test_data.php

      - name: Initialize Galette database
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd galette-core
          bin/console galette:install -v \
            --dbtype=pgsql \
            --dbhost=localhost \
            --dbname=galette_tests \
            --dbuser=galette_tests \
            --dbpass=g@l3tte \
            --admin=admin \
            --password=admin \
            --no-interaction
          # GALETTE_TESTS makes the console look for plugins in tests/plugins,
          # the checked out plugin lives in the regular directory
          GALETTE_PLUGINS_PATH=$(pwd)/galette/plugins bin/console galette:plugins:install-db --all

      - name: Start PHP built-in server
        run: |
          cd galette-core
          GALETTE_PLUGINS_PATH=$(pwd)/galette/plugins DB=${{ env.DB }} GALETTE_TESTS=1 php -S 0.0.0.0:8090 -t galette/webroot tests/router_e2e.php &
          timeout 15 bash -c 'until curl -sf http://127.0.0.1:8090/login > /dev/null; do sleep 1; done'
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8090/plugins/paypal/form")
          if [ "$CODE" != "200" ]; then
            echo "Paypal route returned $CODE (plugin not initialized/active)."
            exit 1
          fi
          echo "PHP server started"

      - name: Install Playwright browsers
        run: |
          cd galette-core
          npx playwright install --with-deps chromium

      - name: Run Paypal E2E tests
        run: |
          cd galette-core
          npm run test:plugins
        env:
          E2E_BASE_URL: http://127.0.0.1:8090
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASS: admin

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-paypal
          path: galette-core/playwright-report/
          retention-days: 7

      - name: Upload test data (logs, photos, etc.)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-data-e2e-paypal
          path: |
            galette-core/tests/tests-data/
            galette-core/galette/data/logs/
            galette-core/galette/data/photos/
          retention-days: 7
          if-no-files-found: ignore
